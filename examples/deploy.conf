# Конфиг для ../deploy.sh: обычный bash, подключается через source. Пути — от каталога этого файла.

# Каталог приложения, куда выпускаем.
APP_DIR=.
# Откуда брать новую версию (пусто — файлы уже на месте, деплой только перезапускает).
SRC_DIR=""
# Что останавливать, по порядку: сначала сторож, потом обёртки, потом сами процессы —
# иначе обёртка или сторож поднимут процесс обратно, пока мы его снимаем.
STOP_MATCH=( 'cli\.ts watch .*watchdog\.json' 'run-forever\.sh.*worker\.js' 'worker\.js' )
# Файлы версии: их бэкапят в archive/<время>/ и, если задан SRC_DIR, заменяют новыми.
FILES=( worker.js watchdog.json )
# Логи: вычищаются от секретов и переезжают в archive/<время>/logs/.
LOGS=( worker.log watchdog.log alerts.log )
# Точные значения из этих env-файлов тоже вычищаются из логов (сами значения не печатаются).
SCRUB_VALUES_FROM=( )
# Свои регулярки для вычистки, в дополнение к встроенным.
SCRUB_PATTERNS=( )
# Точки входа для node --check.
ENTRIES=( worker.js )
# Сухой прогон: запускается с DRY=1 и должен выйти с кодом 0.
DRY_CMD=( node worker.js --once )
# Запуск: отвязанно, через обёртку перезапуска.
START=( bash ../run-forever.sh --log worker.log -- node worker.js )
# Пульс, который должен появиться после запуска, и сколько секунд его ждать.
HEARTBEAT=worker.hb
HEARTBEAT_WAIT=30

# Если процессов несколько, вместо START можно описать функцию:
# start_app() {
#   spawn bash ../run-forever.sh --log worker.log -- node worker.js
#   spawn node ../src/cli.ts watch watchdog.json
# }
